<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Puerto Madryn</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
          
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        .leaflet-popup-content {
            font: 14px "Segoe UI", Arial, sans-serif;
        }
    </style>
</head>
<body>
<div id="map" aria-label="Mapa interactivo de Puerto Madryn"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
    const puertoMadryn = [-42.7692, -65.0385];
    const map = L.map("map").setView(puertoMadryn, 13);

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const cityMarker = L.marker(puertoMadryn)
        .addTo(map)
        .bindPopup("Puerto Madryn");
    let tripLayers = [];

    window.actualizarRuta = function(origenLat, origenLng, destinoLat, destinoLng) {
        tripLayers.forEach(layer => map.removeLayer(layer));
        tripLayers = [];

        if (origenLat === null || destinoLat === null) {
            map.setView(puertoMadryn, 13);
            cityMarker.addTo(map);
            return;
        }

        map.removeLayer(cityMarker);
        const origen = [origenLat, origenLng];
        const destino = [destinoLat, destinoLng];
        tripLayers.push(L.marker(origen).addTo(map).bindPopup("Origen del viaje"));
        tripLayers.push(L.marker(destino).addTo(map).bindPopup("Destino del viaje"));
        tripLayers.push(L.polyline([origen, destino], {
            color: "#2563eb",
            weight: 5,
            opacity: 0.85
        }).addTo(map));
        map.fitBounds(L.latLngBounds(origen, destino).pad(0.2), { maxZoom: 15 });
    };
</script>
</body>
</html>
